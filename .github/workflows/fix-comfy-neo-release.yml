name: Fix Forge Comfy Neo release version (one time)
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-comfy-neo-release.yml
permissions:
  contents: write
jobs:
  fix_release:
    runs-on: ubuntu-latest
    steps:
      - name: Add correct v1.0.3 tag to full source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/v1.0.3 -f sha=8cff6d487f6f403c62fbfb1422220b9accb07781
      - name: Correct existing release without deleting it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/440536588" -f tag_name=v1.0.3 -f name="Forge Comfy Neo v1.0.3" -f body="Stable Forge Comfy Neo v1.0.3 source release. The previous release was labeled v1.0.0 even though VERSION and README were already 1.0.3. The corrected tag points to the complete main-branch v1.0.3 snapshot, including the runtime manager and other required files added after the old tag. No generation code changes were made for this metadata correction. See README.md and CHANGELOG.md for installation and capabilities."
